version: '3.8'

services:
  healthhud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthhud
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Your local timezone, so "today" and weekly averages match your day.
      - TZ=America/New_York
    volumes:
      - ./data:/data
      - ./backups:/backups
    restart: unless-stopped
